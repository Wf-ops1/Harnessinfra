# .harness/graphs/specs/new-feature.yaml
graph:
  name: new-feature
  graph_schema_version: "1.0"
  definition_version: "3.3.0"
  entrypoint: implement_feature
  status: stable
  description: "Operational public workflow for one governed feature change"

policies:
  - policies/verification_policy.yaml
  - policies/tool_policy.yaml
  - policies/context_sufficiency.yaml
  - policies/sandbox_policy.yaml
  - policies/retry_cost_policy.yaml
  - policies/knowledge_sync.yaml

contracts:
  - contracts/nodes/new_feature.py#NewFeatureExecutionState

nodes:
  - id: implement_feature
    type: agent
    role: code_agent
    input_contract: contracts/nodes/new_feature.py#NewFeatureExecutionState
    output_contract: contracts/nodes/new_feature.py#NewFeatureExecutionState
    tool_permissions:
      - tool: apply_patch
        effect: allow
      - tool: git_diff
        effect: allow
      - tool: git_status
        effect: allow
      - tool: list_files
        effect: allow
      - tool: read_file
        effect: allow
      - tool: run_command
        effect: allow
      - tool: search_text
        effect: allow
    on_success: knowledge_sync_update
    on_failure: revert_and_fail

  - id: knowledge_sync_update
    type: agent
    role: knowledge_updater
    input_contract: contracts/nodes/new_feature.py#NewFeatureExecutionState
    output_contract: contracts/nodes/new_feature.py#NewFeatureExecutionState
    on_success: END
    on_failure: revert_and_fail

terminal_states:
  - id: END
    outcome: success
  - id: revert_and_fail
    outcome: failure
